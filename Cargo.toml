[package]
name = "tyw"
version = "0.2.0-rc.2"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap-verbosity-flag = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
humantime = "2"
dirs = "6"
